name: 毎日料金を確認してサイトを更新

on:
  schedule:
    # UTC 22:00 = JST 07:00。料金の改定は予告なく行われるので、変わった日を
    # 正確に押さえるために毎日回す。「いつ変わったか」がこのサイトの価値なので、
    # 巡回の間隔を空けると日付の精度が落ちる。
    - cron: "0 22 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "config/**"
      - "templates/**"
      - "static/**"
      - "src/**"
      - "main.py"
      # テストと依存関係も対象にする。ここが抜けていると、CI が落ちた原因が
      # テスト側にあったとき、それを直すコミットでは CI が再実行されない。
      # 赤いまま気づかず、サイトも最後に成功したビルドのまま止まる。
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/**"

permissions:
  # contents: write は料金履歴(data/)をリポジトリに書き戻すために必須。
  # ここを read にすると毎回まっさらな状態から始まり、履歴が永久に溜まらない。
  # このサイトの資産は履歴そのものなので、この権限がサイトの生死を分ける。
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # 履歴のコミットを途中で殺さない

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # アクションはタグではなくコミットSHAで固定する。
      # タグは付け替え可能なので、@v7 のままだと参照先の中身を差し替えられ得る。
      # 更新は .github/dependabot.yml が出すPRで行う。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # 固定したバージョン以外を絶対に入れない
      - run: pip install --no-deps -r requirements.txt

      # 料金抽出の回帰テスト。
      # 落ちたら巡回もデプロイもしない。間違った料金を配るくらいなら、
      # その日は更新しない方がよい。
      - name: 回帰テスト
        run: |
          pip install --no-deps -r requirements-dev.txt
          python -m pytest tests/ -q
          python -m ruff check src/ main.py tests/ --line-length 100

      - name: 公式サイトの料金を確認してサイトを生成
        run: python main.py

      # 開示ページの消失・広告リンクのrel属性の欠落・テンプレートの未展開を検出する。
      # ここで落とせば壊れた状態が Pages に出ることはない。
      # 生成の直後・アップロードの前に置くこと。
      - name: 生成物を検証する
        run: python main.py --verify

      - name: 料金履歴をコミットする
        run: |
          set -euo pipefail
          git config user.name  "kiji-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "料金に変更なし。コミットするものはありません。"
            exit 0
          fi
          git commit -m "chore(data): 料金を記録 $(date -u +%Y-%m-%d)"
          # 手元の push と衝突したときのために。data/ は追記のみなので
          # rebase で解決できる。
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push に失敗しました。取り込んで再試行します ($attempt/3)"
            git pull --rebase --autostash
          done
          # ここで job を落とさない。push できなくても生成済みのサイトは正しいので
          # デプロイは通す。今回の観測は失われるが、次回の巡回で同じ差分が
          # 再検出されるため履歴に穴は空かない（記録日が1日ずれるだけ）。
          echo "::warning::料金履歴を push できませんでした。次回実行で再記録されます"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
