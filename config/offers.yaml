# 記事にする案件。運用で触るのは基本このファイルだけ。
#
# 【ASPは問わない】
#   A8 でも Zucks でも SmartC でも、承認されたリンクを affiliate_url に貼れば
#   同じ仕組みで記事になる。ゲームのDL案件もここに足すだけ。
#   （A8 の公開ランキングにゲームDL案件はほぼ無い。管理画面の全カタログか、
#     アプリ特化ASPで探して、承認されたものをここに書く）
#
# 【毎日自動で更新されるもの】
#   watch.url を1日1回取得して、料金・キャンペーンの変化を検出する。
#   変わっていれば記事本文の数字が変わり、/updates/ に日付つきで記録される。
#   「最終確認日」も全ページに出る。ここは手を触れなくていい。
#
# 【手で書くもの】
#   pitch / points / verdict。ここを空にしても記事は出るが、
#   verdict が空の案件は「未検証」と明示されて順位も下がる。
#   実際に使っていないのに使ったふりを書かないための作り。
#   2026年3月のコアアップデートで落ちたのは一次情報の無い記事なので、
#   ここを埋めるかどうかがサイトの生死を分ける。

# 成果タイプ。記事の書き方と、ランキングの並びに効く。
#   download … アプリ/ゲームのDL・インストールで成果
#   signup   … 無料登録・会員登録で成果
#   trial    … 無料体験・無料カウンセリングで成果
#   purchase … 購入・課金で成果
#   click    … クリックで成果
#
# 想定成約率。単価×これで期待値を出してランキングを並べる。
# 27.A8 の実測（成果条件別CVR）から持ってきた仮定値であって実績ではない。
conversion_rates:
  download: 0.06
  signup:   0.05
  trial:    0.02
  click:    0.30
  purchase: 0.006

offers:
  # --------------------------------------------------------------
  # 実測で「料金がHTMLからテキストで取れる」ことを確認済みの2件をシードにしてある。
  # affiliate_url は空。提携が承認されたら貼ること（空でも記事は成立する）。
  # --------------------------------------------------------------
  - slug: nativecamp
    name: ネイティブキャンプ
    vendor: 株式会社ネイティブキャンプ
    kind: trial
    category: オンライン英会話
    landing_url: https://nativecamp.net/
    affiliate_url: ""
    watch:
      url: https://nativecamp.net/plan
      # この語の近くにある金額を拾う。ページ上の表記と一致させること。
      labels: [プレミアムプラン, ファミリープラン, ネイティブ受け放題, カラン受け放題]
    # 公式ページを見て書き写した料金。自動抽出はプランごとの金額を断定できない
    # （通常価格と年間割引が併記されていて区別がつかない）ので、ここが正。
    # 機械の仕事は「ページが変わったこと」を毎日検出して要確認を立てること。
    prices:
      - {label: プレミアムプラン, amount: 7480, note: 税込・月額}
      - {label: プレミアムプラン（年間割引適用）, amount: 6800, note: 税込・月額}
      - {label: ファミリープラン, amount: 1980, note: 税込・月額}
      - {label: ネイティブ受け放題オプション, amount: 9800, note: 税込・月額}
    prices_checked: "2026-08-07"
    pitch: レッスン回数無制限。予約なしで今すぐ話せる。
    points:
      - 月額固定でレッスン回数の上限が無い
      - 予約不要ですぐ開始できる
      - 7日間の無料トライアルがある
    # 実際に使ってから書くこと。空のままなら記事に「未検証」と出る。
    verdict: ""

  - slug: dmm-eikaiwa
    name: DMM英会話
    vendor: 合同会社DMM.com
    kind: trial
    category: オンライン英会話
    landing_url: https://eikaiwa.dmm.com/
    affiliate_url: ""
    watch:
      url: https://eikaiwa.dmm.com/
      labels: [スタンダードプラン, プラスネイティブプラン]
    prices:
      - {label: スタンダードプラン 毎日1レッスン, amount: 6980, note: 税込・月額}
      - {label: プラスネイティブプラン 毎日1レッスン, amount: 22880, note: 税込・月額}
    prices_checked: "2026-08-07"
    pitch: 130か国以上の講師。教材が全部無料。
    points:
      - 講師の国籍が広い
      - 教材が無料で使える
      - 2回の無料体験レッスンがある
    verdict: ""

# 【追跡できない相手がいる】
#   Cambly は料金が JavaScript で描画されていて HTML に載っていない（実測: 0件）。
#   こういうサイトは watch を空にすること。空なら取得しに行かず、
#   料金は記事に出さない。取れない値を推測で埋めると読者を騙すことになる。
#
#   - slug: cambly
#     watch: {url: "", labels: []}

# 比較記事はここに書いた組み合わせだけ生成する。
# 全組み合わせを自動生成すると Google の scaled content abuse に該当する。
# Search Console で表示回数が付いた組み合わせを後から足していくのが正しい増やし方。
comparisons:
  - [nativecamp, dmm-eikaiwa]
